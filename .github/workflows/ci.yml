name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Keep in step with rust-toolchain.toml (rustup adds the toml's components/targets).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The desktop player links ALSA (cpal) and libudev (gilrs); winit loads xkbcommon-x11 at
      # run time; xvfb runs the window smoke test.
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config libxkbcommon-x11-0 xvfb

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: WebAssembly build check (farm-sim, farm-cart, farm-runtime, farm-render, farm-ui, farm-player lib)
        run: |
          cargo check -p farm-sim -p farm-cart -p farm-runtime -p farm-render -p farm-ui --target wasm32-unknown-unknown
          cargo check -p farm-player --lib --no-default-features --target wasm32-unknown-unknown

      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # Player templates ship tools/player-licenses/THIRD-PARTY.txt (docs/EXPORT.md).
      - name: Player license notices are current
        if: runner.os == 'Linux'
        run: tools/player-licenses/generate.sh --check

  build-and-test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # FarmEngine.Interop builds crates/farm-ffi during `dotnet build`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      # FarmEngine.Export builds the desktop player template (ALSA for cpal, libudev for gilrs).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      # farmc finds the linux-x64 template the build put in its players/ folder.
      - name: Export a sample game and run it (linux-x64)
        run: |
          dotnet run --project src/FarmEngine.Cli -c Release --no-build -- \
            export fixtures/projects/project-v8.json --target linux-x64 --out export-smoke
          game=$(find export-smoke/linux-x64 -mindepth 1 -maxdepth 1 -type d | head -n 1)
          name=$(basename "$game")
          ls -l "$game" "$game/licenses"
          test -x "$game/$name"
          cmp "$game/game.cart" fixtures/golden/cartridges/project-v8.cart
          tar -tvzf "export-smoke/$name-linux-x64.tar.gz"
          "$game/$name" --headless --replay fixtures/golden/cartridges/twenty-ticks.json | tee exported.json
          target/release/farm-player --headless --cart fixtures/golden/cartridges/project-v8.cart \
            --replay fixtures/golden/cartridges/twenty-ticks.json > reference.json
          diff exported.json reference.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          retention-days: 7

  windows:
    name: Build & publish smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/FarmingRpgMaker.App -c Release -r win-x64 --self-contained -o publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path publish/FarmingRpgMaker.exe)) { throw "publish/FarmingRpgMaker.exe is missing" }
          if (-not (Test-Path publish/farm_ffi.dll)) { throw "publish/farm_ffi.dll (Rust engine library) is missing" }
          if (-not (Test-Path publish/players/windows-x64/farm-player.exe)) { throw "publish/players/windows-x64 (Export Game player template) is missing" }
          $info = (Get-Item publish/FarmingRpgMaker.exe).VersionInfo
          Write-Host "FarmingRpgMaker.exe $($info.ProductVersion) ($([math]::Round((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)) MB total)"

      # Patches the real template's icon and version resources, then runs the game.
      - name: Export a sample game and run it (windows-x64)
        shell: pwsh
        run: |
          dotnet run --project src/FarmEngine.Cli -c Release --no-build -- export fixtures/projects/project-v8.json --target windows-x64 --out export-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $game = Get-ChildItem export-smoke/windows-x64 -Directory | Select-Object -First 1
          $exe = Join-Path $game.FullName "$($game.Name).exe"
          $title = (Get-Content fixtures/projects/project-v8.json -Raw | ConvertFrom-Json).name
          $info = (Get-Item $exe).VersionInfo
          Write-Host "$($info.ProductName) $($info.ProductVersion) / $($info.FileDescription) / $($info.OriginalFilename)"
          if ($info.ProductName -ne $title -or $info.FileDescription -ne $title) { throw "Version info was not written: '$($info.ProductName)'" }
          if ($info.OriginalFilename -ne "$($game.Name).exe") { throw "OriginalFilename is '$($info.OriginalFilename)'" }
          try {
            Add-Type -AssemblyName System.Drawing
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
            Write-Host "Icon: $($icon.Width)x$($icon.Height)"
          } catch {
            Write-Host "::warning::Could not read the exported icon: $_"
          }
          $exported = & $exe --headless --replay fixtures/golden/cartridges/twenty-ticks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reference = & target/release/farm-player.exe --headless --cart fixtures/golden/cartridges/project-v8.cart --replay fixtures/golden/cartridges/twenty-ticks.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $exported
          if ("$exported" -ne "$reference") { throw "The exported game reported $exported, the template $reference" }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FarmingRpgMaker-win-x64-${{ github.sha }}
          path: publish
          retention-days: 7

  player-linux:
    name: Player template (linux-x64, Steam Runtime sniper)
    runs-on: ubuntu-latest
    # The release builds the Linux template here (docs/EXPORT.md): Steam Runtime 3
    # "sniper", Debian 11 with glibc 2.31, so games run on older distributions and Steam Deck.
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.94
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The desktop player links ALSA (cpal) and libudev (gilrs); the SDK normally has both.
      - name: System packages
        shell: bash
        run: |
          if ! pkg-config --exists alsa libudev; then
            apt-get update
            apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
          fi

      - name: Build and run farm-player
        shell: bash
        run: |
          cargo build --release --locked -p farm-player
          ldd --version | head -n 1
          target/release/farm-player --headless --cart fixtures/golden/cartridges/project-v8.cart \
            --replay fixtures/golden/cartridges/twenty-ticks.json
          tools/player-templates/package.sh linux-x64 "0.0.0-ci" target/release/farm-player players

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: player-linux-x64-${{ github.sha }}
          path: players
          retention-days: 7

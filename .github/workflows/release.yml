name: Release
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
        - stable
        - preview
        default: stable
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      app:
        description: Optional app ID; empty selects every advanced app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@e19545fe8e1520a342ef8b4b4bff6fcdac37b356
    with:
      toolkit-ref: e19545fe8e1520a342ef8b4b4bff6fcdac37b356
      channel: ${{ inputs.channel }}
      app: ${{ inputs.app }}
  version:
    name: Check and determine the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      republish: ${{ steps.version.outputs.republish }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Determine version
      id: version
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
        RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      run: |
        "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT
        "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
        "prerelease=$($env:RELEASE_VERSION.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
        "republish=false" >> $env:GITHUB_OUTPUT
    - name: The repository is at this version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: tools/release/versions.sh --release "$VERSION"
    - name: The commit is on main
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        status="$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)"
        case "$status" in
          identical | behind) echo "$SHA is on main ($status)" ;;
          *) echo "::error::$SHA is not on main (compare: $status). Release from main only."; exit 1 ;;
        esac
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
  player-windows:
    name: Player template (windows-x64)
    needs:
    - plan
    - version
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Rust toolchain
      run: |
        rustup toolchain install
        rustc --version
    # RUSTFLAGS replaces the target rustflags of .cargo/config.toml, so it repeats +crt-static:
    # without it the binaries need the Visual C++ runtime and the dumpbin checks below fail.
    - name: Map build paths
      shell: bash
      run: echo "RUSTFLAGS=-C target-feature=+crt-static --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo
        --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
    - name: Build farm-player
      run: cargo build --release --locked -p farm-player
    - name: Stage template
      shell: bash
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: tools/player-templates/package.sh windows-x64 "$VERSION" target/release/farm-player.exe players
    - name: Check the placeholder resources
      shell: pwsh
      run: |
        $info = (Get-Item players/windows-x64/farm-player.exe).VersionInfo
        if (-not "$($info.ProductName)".StartsWith('farm-player template')) { throw "farm-player.exe has no placeholder version info" }
    - name: Check the template needs no VC++ runtime
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
        if (-not $dumpbin) { throw "dumpbin.exe not found" }
        $imports = & $dumpbin /nologo /dependents players/windows-x64/farm-player.exe
        Write-Host ($imports -join "`n")
        if ($imports -match '(?i)vcruntime|msvcp|api-ms-win-crt-') { throw "farm-player.exe needs the Visual C++ runtime" }
    - name: Archive template
      shell: pwsh
      run: Compress-Archive -Path players/windows-x64 -DestinationPath player-windows-x64.zip
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: player-windows-x64
        path: player-windows-x64.zip
        retention-days: 7
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    permissions:
      contents: read
  player-linux:
    name: Player template (linux-x64, Steam Runtime sniper)
    needs:
    - plan
    - version
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:1c33c507bc75d012e77df5727f93b0d5b8c3f7c8d4142ba5f7a16882cc92e014
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Install Rust
      shell: bash
      run: tools/ci/install-rust.sh
    - name: System packages
      shell: bash
      run: |
        if ! pkg-config --exists alsa libudev; then
          apt-get update
          apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
        fi
    - name: Map build paths
      shell: bash
      run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build"
        >> "$GITHUB_ENV"
    - name: Build farm-player
      shell: bash
      run: |
        cargo build --release --locked -p farm-player
        ldd --version | sed -n 1p
    - name: Stage template
      shell: bash
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        tools/player-templates/package.sh linux-x64 "$VERSION" target/release/farm-player players
        players/linux-x64/farm-player --help
        tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='1980-01-01 00:00Z' \
          -czf player-linux-x64.tar.gz -C players linux-x64
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: player-linux-x64
        path: player-linux-x64.tar.gz
        retention-days: 7
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    permissions:
      contents: read
  player-web:
    name: Player template (web demo)
    needs:
    - plan
    - version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Rust toolchain
      run: |
        rustup toolchain install
        rustc --version
    - name: Map build paths
      run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build"
        >> "$GITHUB_ENV"
    - name: wasm-bindgen version
      id: wasm-bindgen
      run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
        >> "$GITHUB_OUTPUT"
    - name: Install wasm-bindgen-cli
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        package-manager-cache: false
    - name: Build and check farm-wasm
      run: |
        tools/wasm/build.sh
        node tools/wasm/smoke.mjs
    - name: Stage template
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        tools/player-templates/package.sh web "$VERSION" tools/wasm/dist players
        tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='1980-01-01 00:00Z' \
          -czf player-web.tar.gz -C players web
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: player-web
        path: player-web.tar.gz
        retention-days: 7
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  smoke-linux:
    name: Export smoke test (release linux-x64 template)
    needs:
    - plan
    - version
    - player-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Pin the .NET SDK
      shell: pwsh
      run: |
        $json = Get-Content global.json -Raw | ConvertFrom-Json
        $json.sdk.rollForward = 'disable'
        $json | ConvertTo-Json -Depth 5 | Set-Content global.json
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: System packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: player-linux-x64
        path: player-templates
    - name: Build farmc
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        mkdir players
        tar -xzf player-templates/player-linux-x64.tar.gz -C players
        dotnet build src/FarmEngine.Cli -c Release "-p:Version=$VERSION" -p:FarmPlayerSkipCargo=true
    - name: Export a sample game and run it
      run: tools/release/smoke-export.sh linux-x64 players smoke-linux-x64.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: smoke-linux-x64
        path: smoke-linux-x64.json
        retention-days: 7
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read
  release:
    name: Build, test & pack
    needs:
    - plan
    - version
    - player-windows
    - player-linux
    - player-web
    - smoke-linux
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.plan.outputs.sha }}
    - name: Pin the .NET SDK
      shell: pwsh
      run: |
        $json = Get-Content global.json -Raw | ConvertFrom-Json
        $json.sdk.rollForward = 'disable'
        $json | ConvertTo-Json -Depth 5 | Set-Content global.json
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - name: Rust toolchain
      run: |
        rustup toolchain install
        rustc --version
    # RUSTFLAGS replaces the target rustflags of .cargo/config.toml, so it repeats +crt-static:
    # without it the binaries need the Visual C++ runtime and the dumpbin checks below fail.
    - name: Map build paths
      shell: bash
      run: echo "RUSTFLAGS=-C target-feature=+crt-static --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo
        --remap-path-prefix=$GITHUB_WORKSPACE=/build" >> "$GITHUB_ENV"
    - name: Download player templates
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: player-*
        path: player-templates
        merge-multiple: true
    - name: Unpack player templates
      shell: pwsh
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        New-Item -ItemType Directory -Force players | Out-Null
        Expand-Archive player-templates/player-windows-x64.zip -DestinationPath players
        tar -xzf player-templates/player-linux-x64.tar.gz -C players
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        tar -xzf player-templates/player-web.tar.gz -C players
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        foreach ($target in 'windows-x64', 'linux-x64', 'web') {
          $manifest = Get-Content "players/$target/template.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:VERSION) { throw "$target template is version $($manifest.version), expected $env:VERSION" }
        }
        Get-ChildItem -Recurse players | Format-Table FullName, Length
    - name: Test
      run: dotnet test -c Release --logger trx --results-directory TestResults
    - name: Publish app
      shell: pwsh
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        $templates = (Resolve-Path players).Path
        dotnet publish src/Tractr.App -c Release -r win-x64 --self-contained "-p:Version=$env:VERSION" "-p:FarmPlayerTemplatesDir=$templates" -o publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        foreach ($file in 'players/windows-x64/farm-player.exe', 'players/windows-x64/template.json', 'players/linux-x64/farm-player', 'players/linux-x64/THIRD-PARTY.txt', 'licenses/LICENSE.txt', 'licenses/THIRD-PARTY-dotnet.txt', 'licenses/THIRD-PARTY-rust.txt') {
          if (-not (Test-Path "publish/$file")) { throw "publish/$file is missing" }
        }
    - name: Check farm_ffi.dll needs no VC++ runtime
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
        if (-not $dumpbin) { throw "dumpbin.exe not found" }
        $imports = & $dumpbin /nologo /dependents publish/farm_ffi.dll
        Write-Host ($imports -join "`n")
        if ($imports -match '(?i)vcruntime|msvcp|api-ms-win-crt-') { throw "farm_ffi.dll needs the Visual C++ runtime" }
    - name: farmc at the release version
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: dotnet build src/FarmEngine.Cli -c Release "-p:Version=$env:VERSION" -p:FarmPlayerSkipCargo=true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: smoke-linux-x64
        path: smoke
    - name: Export smoke test (release windows-x64 template)
      shell: bash
      run: |
        tools/release/smoke-export.sh windows-x64 players smoke/smoke-windows-x64.json
        if ! diff smoke/smoke-windows-x64.json smoke/smoke-linux-x64.json; then
          echo "The Windows and Linux release templates play the sample game differently." >&2
          exit 1
        fi
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-plan
        path: plan
    - name: Write release notes
      shell: pwsh
      run: |
        # The plan's notes: the CHANGELOG sections of every version since the last release, also the
        # GitHub Release body.
        $plan = Get-Content plan/release-plan.json -Raw | ConvertFrom-Json
        $notes = ($plan.selected | Where-Object app -eq 'farming-rpg-maker').notes
        if (-not $notes) { throw 'The release plan has no notes for farming-rpg-maker' }
        Set-Content -Path release-notes.md -Value $notes -Encoding utf8
        Write-Host '--- release-notes.md ---'
        Get-Content release-notes.md
    - name: Install vpk
      run: dotnet tool install -g vpk --version $env:VPK_VERSION
    - name: Download previous release (for delta updates)
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ needs.version.outputs.prerelease }}
      run: |
        $vpkArgs = @('download', 'github', '--repoUrl', "https://github.com/${{ github.repository }}", '--token', $env:GITHUB_TOKEN, '--outputDir', 'Releases')
        if ($env:PRERELEASE -eq 'true') { $vpkArgs += '--pre' }
        vpk @vpkArgs
        if ($LASTEXITCODE -ne 0) {
          Write-Host '::notice::No previous release found - this release will only contain full packages.'
        }
        exit 0
    - name: Pack with Velopack
      shell: pwsh
      env:
        VERSION: ${{ needs.version.outputs.version }}
        WINDOWS_SIGN_PARAMS: ${{ secrets.WINDOWS_SIGN_PARAMS }}
      run: |
        $vpkArgs = @(
          'pack',
          '--packId', $env:PACK_ID,
          '--packVersion', $env:VERSION,
          '--packDir', 'publish',
          '--runtime', 'win-x64',
          '--mainExe', 'Tractr.exe',
          '--packTitle', 'Tractr',
          '--packAuthors', 'Tractr contributors',
          '--icon', 'src/Tractr.App/Assets/app.ico',
          '--releaseNotes', 'release-notes.md',
          '--outputDir', 'Releases'
        )
        if ($env:WINDOWS_SIGN_PARAMS) {
          Write-Host 'Code signing enabled (WINDOWS_SIGN_PARAMS is set).'
          $vpkArgs += @('--signParams', $env:WINDOWS_SIGN_PARAMS)
        } else {
          Write-Host '::warning::WINDOWS_SIGN_PARAMS is not set - the installer is unsigned and SmartScreen will warn users.'
        }
        vpk @vpkArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-ChildItem Releases | Format-Table Name, Length
    - name: Checksums and build info
      shell: pwsh
      env:
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        $files = @(Get-ChildItem Releases -File | Where-Object { $_.Extension -ne '.nupkg' -or $_.Name -like "*-$env:VERSION-*" })
        $files += @(Get-ChildItem player-templates -File)
        $lines = $files | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
        # LF line ends, as sha256sum --check expects.
        [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n")
        Get-Content SHA256SUMS
        $info = @(
          "version:    $env:VERSION",
          "commit:     ${{ github.sha }}",
          "dotnet sdk: $(dotnet --version)",
          "rustc:      $(rustc --version)",
          "vpk:        $env:VPK_VERSION",
          "runner:     $env:ImageOS $env:ImageVersion"
        )
        Set-Content -Path build-info.txt -Value $info -Encoding utf8
        Get-Content build-info.txt
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-release
        path: TestResults
        retention-days: 7
        if-no-files-found: ignore
    - name: Keep build output
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-bundle-${{ needs.version.outputs.version }}
        path: |
          Releases
          player-templates
          release-notes.md
          SHA256SUMS
          build-info.txt
        retention-days: 30
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    permissions:
      contents: read
  publish:
    name: Publish
    needs:
    - plan
    - version
    - release
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-bundle-${{ needs.version.outputs.version }}
        path: bundle
    - name: Build provenance attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-checksums: bundle/SHA256SUMS
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: e19545fe8e1520a342ef8b4b4bff6fcdac37b356
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: farming-rpg-maker
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from bundle --bundle unified-bundle --sha
        "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bundle-farming-rpg-maker
        path: unified-bundle
        if-no-files-found: error
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
  publish-farming-rpg-maker:
    needs:
    - plan
    - publish
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['farming-rpg-maker'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@e19545fe8e1520a342ef8b4b4bff6fcdac37b356

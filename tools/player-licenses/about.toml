# cargo-about configuration for the license notices shipped with exported games
# (licenses/THIRD-PARTY.txt). See generate.sh.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
]
# The union of both desktop templates' dependency graphs.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# Build scripts and tests don't ship in the player.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are not third-party.
private = { ignore = true }

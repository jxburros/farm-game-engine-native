<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #10140f; color: #e8e2cf; font: 16px system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; outline: none; image-rendering: pixelated; touch-action: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #status[hidden] { display: none; }
  /* Touch controls (phones and tablets): a D-pad and action buttons over the game. */
  #touch { position: fixed; inset: auto 0 0 0; display: flex; justify-content: space-between; align-items: flex-end;
    padding: 16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    pointer-events: none; user-select: none; -webkit-user-select: none; }
  #touch[hidden] { display: none; }
  #touch .pad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 4px; pointer-events: auto; }
  #touch .actions { display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto; }
  #touch .row { display: flex; gap: 8px; }
  #touch button { min-width: 52px; min-height: 52px; border-radius: 12px; border: 2px solid rgba(232, 226, 207, 0.55);
    background: rgba(16, 20, 15, 0.55); color: #e8e2cf; font: 20px system-ui, sans-serif; touch-action: none;
    -webkit-tap-highlight-color: transparent; }
  #touch button.round { border-radius: 50%; }
  #touch button.primary { min-width: 64px; min-height: 64px; background: rgba(176, 60, 44, 0.75); font-weight: bold; }
  #touch button.held { background: rgba(232, 226, 207, 0.35); }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="{{TITLE}}"></canvas>
<div id="status" role="status">Loading…</div>
<div id="touch" role="group" aria-label="Touch controls" hidden>
  <div class="pad">
    <button type="button" tabindex="-1" data-action="move-up" aria-label="Move up" style="grid-area: up">▲</button>
    <button type="button" tabindex="-1" data-action="move-left" aria-label="Move left" style="grid-area: left">◀</button>
    <button type="button" tabindex="-1" data-action="move-right" aria-label="Move right" style="grid-area: right">▶</button>
    <button type="button" tabindex="-1" data-action="move-down" aria-label="Move down" style="grid-area: down">▼</button>
  </div>
  <div class="actions">
    <div class="row">
      <button type="button" tabindex="-1" class="round" data-action="menu" aria-label="Menu">☰</button>
      <button type="button" tabindex="-1" class="round" data-action="inventory" aria-label="Inventory">🎒</button>
      <button type="button" tabindex="-1" class="round" data-action="sleep" aria-label="Sleep">💤</button>
    </div>
    <button type="button" tabindex="-1" class="round primary" data-action="interact" aria-label="Interact">A</button>
  </div>
</div>
<noscript>This game needs JavaScript and WebAssembly.</noscript>
<script type="module" src="game.js"></script>
</body>
</html>

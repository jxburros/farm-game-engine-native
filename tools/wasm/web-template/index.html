<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" tabindex="0" aria-label="{{TITLE}}"></canvas>
<div id="status" role="status">Loading…</div>
<div id="notice" role="alert" hidden></div>
<div id="touch" role="group" aria-label="Touch controls" hidden>
  <div class="pad">
    <button type="button" tabindex="-1" class="up" data-action="move-up" aria-label="Move up">▲</button>
    <button type="button" tabindex="-1" class="left" data-action="move-left" aria-label="Move left">◀</button>
    <button type="button" tabindex="-1" class="right" data-action="move-right" aria-label="Move right">▶</button>
    <button type="button" tabindex="-1" class="down" data-action="move-down" aria-label="Move down">▼</button>
  </div>
  <div class="actions">
    <div class="row">
      <button type="button" tabindex="-1" class="round" data-action="menu" aria-label="Menu">☰</button>
      <button type="button" tabindex="-1" class="round" data-action="inventory" aria-label="Inventory">🎒</button>
      <button type="button" tabindex="-1" class="round" data-action="sleep" aria-label="Sleep">💤</button>
    </div>
    <button type="button" tabindex="-1" class="round primary" data-action="interact" aria-label="Interact">A</button>
  </div>
</div>
<noscript>This game needs JavaScript and WebAssembly.</noscript>
<script type="module" src="game.js"></script>
</body>
</html>

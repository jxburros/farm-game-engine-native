[package]
name = "farm-ffi"
description = "C ABI over farm-sim for .NET (FarmEngine.Interop)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "farm_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
farm-sim = { path = "../farm-sim" }
farm-cart = { path = "../farm-cart" }
farm-runtime = { path = "../farm-runtime" }
farm-render = { path = "../farm-render" }
# The embeddable player without the desktop window/audio/gamepad layer.
farm-player = { path = "../farm-player", default-features = false, features = ["audio-out"] }
farm-ui = { path = "../farm-ui" }
serde.workspace = true
serde_json.workspace = true

[lints.rust]
# The FFI crate is the one place `unsafe` is allowed: it only dereferences pointers .NET hands it.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
missing_safety_doc = "deny"

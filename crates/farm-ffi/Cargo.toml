[package]
name = "farm-ffi"
description = "C ABI over farm-sim for .NET (FarmEngine.Interop)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "farm_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
farm-sim = { path = "../farm-sim" }
farm-runtime = { path = "../farm-runtime" }
serde_json.workspace = true

[lints.rust]
# The FFI crate is the one place `unsafe` is allowed: it only dereferences pointers .NET hands it.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
missing_safety_doc = "deny"

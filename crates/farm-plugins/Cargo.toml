[package]
name = "farm-plugins"
description = "Plugin sandbox: QuickJS compiled to WebAssembly, run in wasmi with fuel and memory budgets (port of Plugins.cs)"
version.workspace = true
edition.workspace = true
# wasmi 2 needs Rust 1.86.
rust-version = "1.86"
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
farm-sim = { path = "../farm-sim" }
serde.workspace = true
serde_json.workspace = true
# Pure-Rust interpreter: no JIT (works where JITs are forbidden), fast instantiation. No `wat`
# (text format) and no memory64; `validate` checks the guest when it loads; `deterministic`
# canonicalizes NaNs. Its optimized builds must not have debug assertions (see the root
# Cargo.toml). The guest runs from guest/farm_plugin_guest.wasm, checked in.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch", "deterministic"] }

[features]
# wasmi's portable loop dispatch instead of its tail-call dispatch. Slower, but it never relies on
# LLVM's sibling-call optimization: turn it on for builds that compile wasmi below opt-level 2,
# with debug assertions, or with sanitizers (docs/PLUGINS.md, "Sandbox hardening").
portable-dispatch = ["wasmi/portable-dispatch"]

[dev-dependencies]
sha2 = "0.11"
# Reads the checked-in guest in tests (the version wasmi already uses).
wasmparser = { version = "0.228", default-features = false, features = ["std"] }

[lints]
workspace = true

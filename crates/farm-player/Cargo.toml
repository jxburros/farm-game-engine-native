[package]
name = "farm-player"
description = "The Farming RPG Maker game player: headless replays, the embeddable graphical player and the desktop game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
# The desktop game: a window (winit + softbuffer), gamepads (gilrs), audio (cpal), user folders
# (directories) and the system language (sys-locale). Without it the crate is the
# platform-independent player library (what farm-ffi embeds in the editor, and what builds for
# wasm32).
desktop = ["audio-out", "dep:winit", "dep:softbuffer", "dep:gilrs", "dep:directories", "dep:sys-locale"]
# Sound output on the default device (cpal), without the rest of the desktop game: the editor's
# Play Mode.
audio-out = ["dep:cpal"]

[dependencies]
farm-cart = { path = "../farm-cart" }
farm-sim = { path = "../farm-sim" }
farm-runtime = { path = "../farm-runtime" }
farm-plugins = { path = "../farm-plugins" }
farm-render = { path = "../farm-render" }
farm-ui = { path = "../farm-ui" }
serde.workspace = true
serde_json.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
gilrs = { version = "0.11", optional = true }
cpal = { version = "0.18", optional = true }
directories = { version = "6", optional = true }
sys-locale = { version = "0.3", optional = true }

# build.rs embeds placeholder icon and version resources when the target is Windows;
# Export Game patches them (docs/EXPORT.md).
[build-dependencies]
embed-resource = "3"

[lints]
workspace = true

# Rust workspace: the part of Farming RPG Maker that runs while a game is
# being played (see docs/LANGUAGES.md). `farm-sim` is the deterministic core,
# `farm-cart` the cartridge and save formats, `farm-runtime` the timestep, input
# and minigame logic, `farm-host` the JSON protocol hosts speak, `farm-ffi` the C ABI
# that .NET loads through `FarmEngine.Interop`, and `farm-wasm` the same API for the web.
[workspace]
resolver = "2"
members = [
    "crates/farm-sim",
    "crates/farm-cart",
    "crates/farm-cart-schema",
    "crates/farm-runtime",
    "crates/farm-render",
    "crates/farm-ui",
    "crates/farm-host",
    "crates/farm-ffi",
    "crates/farm-wasm",
    "crates/farm-player",
    "crates/farm-plugins",
    "crates/farm-bench",
    "crates/farm-fuzz",
]
# The plugin guest builds only for wasm32-wasip1 (tools/plugin-guest/build.sh); its output is
# checked in under crates/farm-plugins/guest. The cargo-fuzz targets (fuzz/) need nightly; the
# stable tests of crates/farm-fuzz run the same entry points.
exclude = ["crates/farm-plugin-guest", "fuzz"]

[workspace.package]
version = "0.3.0-dev"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jxburros/farm-game-engine-native"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
serde_path_to_error = "0.1"
ryu-js = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Determinism rules (docs/LANGUAGES.md "Determinism rules for Rust"). The
# disallowed lists live in clippy.toml at the workspace root.
disallowed_types = "deny"
disallowed_methods = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1

# The simulation does its arithmetic on numbers from content, plugins and saves. It saturates
# where a value can run off the end of its type; anything missed panics in release too (the
# hosts catch the panic and stop the session) instead of wrapping silently into a wrong state.
[profile.release.package.farm-sim]
overflow-checks = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# farm-plugins runs plugins in wasmi, whose optimized builds dispatch every wasm instruction
# with a tail call and rely on LLVM turning it into a jump. Debug assertions put code after
# those calls, so each instruction would grow the native stack until a long-running plugin
# crashed the host. Keep them off for wasmi in every profile (release has them off already).
# The farm-plugins test a_plugin_running_its_whole_budget_fits_in_a_small_native_stack fails if
# this breaks; builds that cannot keep it use farm-plugins' portable-dispatch feature.
[profile.dev.package.wasmi]
debug-assertions = false
